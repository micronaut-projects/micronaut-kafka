pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id("io.micronaut.build.shared.settings") version "8.1.4"
}

enableFeaturePreview("TYPESAFE_PROJECT_ACCESSORS")

// Micronaut core 5.3.0-SNAPSHOT, which carries the development-mode API, comes from the Central snapshots
// repository, from which only io.micronaut snapshots are resolved. Projects declare their own repositories,
// which replace the settings ones, so it is added to each project too.
// Remove once the build moves to a core release.
def micronautSnapshotRepositories = { RepositoryHandler repositories ->
    repositories.maven {
        url = "https://central.sonatype.com/repository/maven-snapshots/"
        mavenContent {
            snapshotsOnly()
        }
        content {
            includeGroupByRegex("io\\.micronaut(\\..*)?")
        }
    }
}
dependencyResolutionManagement {
    micronautSnapshotRepositories(repositories)
    repositories {
        mavenCentral()
    }
}
gradle.beforeProject {
    micronautSnapshotRepositories(it.repositories)
}

rootProject.name = 'kafka-parent'

micronautBuild {
    useStandardizedProjectNames=true
    importMicronautCatalog()
    importMicronautCatalog("micronaut-cache")
    importMicronautCatalog("micronaut-micrometer")
    importMicronautCatalog("micronaut-reactor")
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-tracing")
}

include 'kafka-bom'
include 'kafka'
include 'kafka-streams'
include 'tests:tasks-sasl-plaintext'
include 'test-suite'
include 'test-suite-groovy'
include 'test-suite-kotlin'
include 'test-suite-python'
include 'test-suite-kafka-utils'
include 'test-suite-dev-reload'
