[versions]
micronaut = "5.2.22"
micronaut-platform = "5.2.5"
micronaut-gradle-plugin = "5.0.2"
micronaut-test = "5.2.0"
managed-kafka = '4.4.0'
awaitility = '4.3.0'
opentracing-kafka-client = '0.1.15'
opentracing-mock = '0.33.0'
zipkin-brave-kafka-clients = '6.3.1'
lz4-java = '1.14.0'
okafka = '23.26.1.0'
# OKafka is built on kafka-clients 3.9 and fails to load on the 4.x line
okafka-kafka-clients = '3.9.2'
okafka-ojdbc = '23.26.4.0.0'

micronaut-cache = "6.2.0"
micronaut-micrometer = "6.1.2"
micronaut-reactor = "4.3.0"
micronaut-serde = "3.2.6"
micronaut-tracing = "8.3.0"

[libraries]
# Core
micronaut-core = { module = 'io.micronaut:micronaut-core-bom', version.ref = 'micronaut' }

managed-kafka-clients = { module = 'org.apache.kafka:kafka-clients', version.ref = 'managed-kafka' }
managed-kafka-streams = { module = 'org.apache.kafka:kafka-streams', version.ref = 'managed-kafka' }
lz4-java = '1.14.0'

opentracing-kafka-client = { module = 'io.opentracing.contrib:opentracing-kafka-client', version.ref = 'opentracing-kafka-client' }
opentracing-mock = { module = 'io.opentracing:opentracing-mock', version.ref = 'opentracing-mock' }

zipkin-brave-kafka-clients = { module = 'io.zipkin.brave:brave-instrumentation-kafka-clients', version.ref = 'zipkin-brave-kafka-clients' }
awaitility = { module = 'org.awaitility:awaitility', version.ref = 'awaitility' }

micronaut-cache = "6.2.0"
micronaut-micrometer = "6.1.2"
micronaut-reactor = { module = "io.micronaut.reactor:micronaut-reactor-bom", version.ref = "micronaut-reactor" }
micronaut-serde = { module = "io.micronaut.serde:micronaut-serde-bom", version.ref = "micronaut-serde" }
micronaut-tracing = { module = "io.micronaut.tracing:micronaut-tracing-bom", version.ref = "micronaut-tracing" }
micronaut-test = { module = "io.micronaut.test:micronaut-test-bom", version.ref = "micronaut-test" }
testcontainers = { module = "org.testcontainers:testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka" }
testcontainers-oracle-free = { module = "org.testcontainers:testcontainers-oracle-free" }
okafka = { module = "com.oracle.database.messaging:okafka", version.ref = "okafka" }
okafka-kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "okafka-kafka-clients" }
okafka-ojdbc = '23.26.4.0.0'
micronaut-gradle-plugin = { module = "io.micronaut.gradle:micronaut-gradle-plugin", version.ref = "micronaut-gradle-plugin" }

[plugins]
